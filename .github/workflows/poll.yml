name: GPU Availability Poll

on:
  schedule:
    - cron: "0,10,20,30,40,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Get the latest copy of this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install required library
        run: pip install requests

      - name: Run the availability check
        env:
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python check_availability.py

      - name: Collect inference performance stats
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python check_perf.py

      - name: Collect Vast utilization
        run: python fetch_market_stats.py utilization || echo "utilization fetch failed, continuing"

      - name: Save the new data point back to the repository
        run: |
          git config user.name "gpu-tracker-bot"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "data point $(date -u +'%Y-%m-%d %H:%M')" || echo "nothing to commit"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase && git push; then pushed=1; break; fi
            echo "push blocked, retrying in 10s..."
            sleep 10
          done
          # A rejected push used to exit 0 here (the loop's last command
          # was sleep), so GitHub showed green while nothing landed for
          # nine days in Oct 2026. Fail loudly so the failure email fires.
          if [ "$pushed" != 1 ]; then echo "::error::push failed after 5 attempts"; exit 1; fi
