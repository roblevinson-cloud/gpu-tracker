name: Build Index Chart

on:
  workflow_dispatch:
  schedule:
    # Every 6h, not daily. GitHub queues scheduled runs on a best-effort
    # basis and this repo has seen 5-10h of drift, which left the charts
    # nearly a day stale. Four attempts a day bounds that; each run is
    # idempotent, so extra runs just refresh the same day's rows.
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas matplotlib requests pyyaml
      - name: Collect OpenRouter token data
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python check_tokens.py
      - name: Collect cloud list prices
        run: python fetch_cloud_prices.py || echo "cloud price fetch failed, continuing"
      - name: Collect cluster lease rates
        run: python fetch_market_stats.py sfcompute || echo "lease rate fetch failed, continuing"
      - name: Collect Artificial Analysis benchmarks
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python fetch_aa.py || echo "AA fetch failed, continuing"
      - run: python build_index.py

      - run: python build_economics.py
      - run: |
          git config user.name "gpu-tracker-bot"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "rebuild index charts" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "push blocked, retrying in 10s..."
            sleep 10
          done
