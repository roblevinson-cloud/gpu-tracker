# ============================================================
# ARTIFICIAL ANALYSIS MAP for fetch_aa.py
#
# models: OpenRouter model slug -> Artificial Analysis model slug.
#   Keyed by the OpenRouter slug (the one in perf_log.csv and
#   tokens_by_model.csv), never by brand name. AA lists each
#   reasoning-effort setting as its own model; use the DEFAULT/
#   max-effort slug (the bare one) because OpenRouter's endpoint
#   stats don't split by effort either. Dated OpenRouter slugs map
#   to AA's dated variants where AA keeps them (DeepSeek V4 Flash
#   0731 vs 0420). Find slugs at artificialanalysis.ai/models/<slug>
#   or in the API listing (fetch_aa.py prints unmapped hints).
#
# hosts: AA host name -> OpenRouter provider name, for the join
#   against perf_log.csv. Only needed where the two differ; a host
#   absent here keeps its AA name (Fireworks, Novita, DeepInfra,
#   CoreWeave, Parasail, SiliconFlow, Crusoe, DigitalOcean, Nebius,
#   OpenAI, Anthropic already match). Quantisation / tier tags AA
#   appends in parentheses -- "(FP8)", "(NVFP4)", "(FAST)" -- and
#   the " BF16" suffix are stripped into a separate `variant`
#   column BEFORE this lookup, so key on the bare name.
#
# Coverage note: AA benchmarks the underlying host directly with a
# fixed probe (1 parallel query, 1000-token prompt, P50 over 72h);
# OpenRouter's numbers are passive telemetry from whatever traffic
# it routes. Disagreement between them is the point of collecting
# both -- see HANDOFF.md "Artificial Analysis".
# ============================================================

models:
